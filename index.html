    body {

      align-items: center;
      gap: 20px;
      padding: 0 25px;

    }

      width: 38px;

      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      font-size: 22px;
    }

    .apps:hover {
      background: #f1f3f4;
    }

    .signin {
      background: #1a73e8;
      color: white;
      border: none;
      padding: 10px 20px;
      border-radius: 5px;
      font-size: 14px;
      cursor: pointer;
    }

    .main {
      display: flex;
      flex-direction: column;
      align-items: center;
      margin-top: 150px;
    }

    .google-logo {
      font-size: 92px;
      font-weight: 500;
      letter-spacing: -8px;
      margin-bottom: 35px;
    }

    .blue { color: #4285f4; }
    .red { color: #ea4335; }
    .yellow { color: #fbbc05; }
    .green { color: #34a853; }

    .search-box {
      width: min(580px, 90%);
      height: 48px;
      border: 1px solid #dfe1e5;
      border-radius: 24px;
      display: flex;
      align-items: center;
      padding: 0 18px;
      box-shadow: 0 1px 6px rgba(32,33,36,.15);

    .search-icon {
      color: #9aa0a6;

      margin-right: 12px;
    }

    .search-box input {
      flex: 1;
      border: none;
      outline: none;
      font-size: 16px;
    }

    .mic {
      color: #4285f4;
      font-size: 20px;
    }

    .buttons {
      margin-top: 30px;
      display: flex;
      gap: 12px;
    }

    .buttons button {
      background: #f8f9fa;
      border: 1px solid #f8f9fa;
      padding: 11px 18px;
      border-radius: 4px;
      color: #3c4043;
      cursor: pointer;
    }

    .buttons button:hover {
      border-color: #dadce0;
      box-shadow: 0 1px 1px rgba(0,0,0,.1);
    }

    .footer {
      position: fixed;
      bottom: 0;
      width: 100%;
      background: #f2f2f2;
      color: #70757a;
      padding: 18px 30px;
      font-size: 14px;
    }
  </style>
</head>

  <script>
    function search() {
      const query = document.getElementById("search").value.trim();

      if (query) {
        window.location.href =
          "https://www.google.com/search?q=" + encodeURIComponent(query);
      }
    }

    function feelingLucky() {
      const query = document.getElementById("search").value.trim();

      if (query) {
        window.location.href =
          "https://www.google.com/search?q=" + encodeURIComponent(query) + "&btnI=1";
      }
    }

    document.getElementById("search").addEventListener("keydown", function(e) {
      if (e.key === "Enter") {
        search();
      }
    });
  </script>
</body>
